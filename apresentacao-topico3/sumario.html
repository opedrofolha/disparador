<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Sumário</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700;800&display=block" rel="stylesheet">
<style>
:root{--teal:#1597A8;--rose:#C98B80;--gray:#E8E8E8}
*{box-sizing:border-box;margin:0;padding:0}body{background:#fff}
.slide{width:2000px;height:1125px;position:relative;overflow:hidden;background:#fff}
.frame{position:absolute;inset:40px 34px;border:4px solid var(--teal)}
.frame i{position:absolute;width:16px;height:16px;border:4px solid var(--teal);background:#fff}
.frame i:nth-child(1){left:-12px;top:-12px}.frame i:nth-child(2){right:-12px;top:-12px}.frame i:nth-child(3){left:-12px;bottom:-12px}.frame i:nth-child(4){right:-12px;bottom:-12px}
.title{position:absolute;left:50%;transform:translateX(-50%);top:70px;background:var(--gray);padding:6px 110px 14px;font-family:'Anton';font-size:70px;line-height:1.15}
.list{position:absolute;left:130px;right:130px;top:250px;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(4,170px);gap:30px 70px}
.it{display:flex;align-items:center;background:var(--gray);height:150px;padding:0 30px 0 22px}
.n{flex:none;width:112px;height:112px;background:var(--rose);color:#fff;font-family:'Montserrat';font-weight:800;font-size:56px;display:flex;align-items:center;justify-content:center;margin-right:30px}
.t{font-family:'Anton';font-size:40px;line-height:1.15;color:#444}
</style></head><body><section class="slide">
<div class="frame"><i></i><i></i><i></i><i></i></div>
<div class="title">Sumário</div>
<div class="list">
<div class="it"><div class="n">01</div><div class="t">Abordagem Inicial</div></div>
<div class="it"><div class="n">02</div><div class="t">Métodos Hormonais de Contracepção de Emergência</div></div>
<div class="it"><div class="n">03</div><div class="t">DIU de Cobre como CE + Aspectos Clínicos e Éticos da CE</div></div>
<div class="it"><div class="n">04</div><div class="t">Laqueadura</div></div>
<div class="it"><div class="n">05</div><div class="t">Vasectomia</div></div>
<div class="it"><div class="n">06</div><div class="t">Legislação</div></div>
<div class="it"><div class="n">07</div><div class="t">Quiz</div></div>
</div></section></body></html>
